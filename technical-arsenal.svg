<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="370">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
      .header { font-family: 'Fira Code', 'Courier New', monospace; font-size: 20px; font-weight: bold; fill: #00f5ff; filter: drop-shadow(0px 0px 5px rgba(0,245,255,0.5)); }
      .category { font-family: 'Fira Code', sans-serif; font-size: 14px; font-weight: bold; fill: #00ff66; }
      .skills { font-family: 'Fira Code', sans-serif; font-size: 13px; fill: #c9d1d9; }
      .row-bg { fill: #161b22; opacity: 0.8; rx: 6px; stroke: #21262d; stroke-width: 1px; }
      
      /* Matrix Code Rain Falling Animation */
      .rain { font-family: 'Courier New', monospace; font-size: 13px; fill: #00ff66; opacity: 0.25; }
      @keyframes fall {
        0% { transform: translateY(-100px); opacity: 0; }
        25% { opacity: 0.45; }
        75% { opacity: 0.45; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      .s1 { animation: fall 3s infinite linear; }
      .s2 { animation: fall 2.3s infinite linear 0.4s; }
      .s3 { animation: fall 3.6s infinite linear 0.8s; }
      .s4 { animation: fall 2.7s infinite linear 0.2s; }
      .s5 { animation: fall 3.2s infinite linear 1.1s; }
      .s6 { animation: fall 2.5s infinite linear 0.6s; }
    </style>
  </defs>

  <!-- Main Terminal Background Panel -->
  <rect class="bg" width="800" height="370" />

  <!-- Background Layer: Matrix Rain Streams -->
  <g class="rain">
    <text x="30" y="0" class="s1">01101<tspan x="30" dy="18">0xFF4</tspan><tspan x="30" dy="18">10110</tspan><tspan x="30" dy="18">0x7E</tspan></text>
    <text x="160" y="0" class="s2">11001<tspan x="160" dy="18">01010</tspan><tspan x="160" dy="18">0xA92</tspan><tspan x="160" dy="18">10101</tspan></text>
    <text x="310" y="0" class="s3">0x8B<tspan x="310" dy="18">11011</tspan><tspan x="310" dy="18">00101</tspan><tspan x="310" dy="18">0xFF0</tspan></text>
    <text x="470" y="0" class="s4">10011<tspan x="470" dy="18">01110</tspan><tspan x="470" dy="18">0x3D1</tspan><tspan x="470" dy="18">11010</tspan></text>
    <text x="620" y="0" class="s5">0x04<tspan x="620" dy="18">10101</tspan><tspan x="620" dy="18">01001</tspan><tspan x="620" dy="18">0x9C</tspan></text>
    <text x="740" y="0" class="s6">01101<tspan x="740" dy="18">10010</tspan><tspan x="740" dy="18">01111</tspan><tspan x="740" dy="18">10100</tspan></text>
  </g>

  <!-- Header Title -->
  <text x="30" y="40" class="header">🛠 TECHNICAL ARSENAL</text>

  <!-- Row 1: Cybersecurity -->
  <rect x="25" y="60" width="750" height="48" class="row-bg" />
  <text x="40" y="90" class="category">Cybersecurity</text>
  <text x="220" y="90" class="skills">Network Security, Cryptography, Digital Forensics, Vulnerability Analysis</text>

  <!-- Row 2: Security Tools -->
  <rect x="25" y="118" width="750" height="48" class="row-bg" />
  <text x="40" y="148" class="category">Security Tools</text>
  <text x="220" y="148" class="skills">BurpSuite, Wireshark, GDB, ChromaDB, Whisper</text>

  <!-- Row 3: Programming -->
  <rect x="25" y="176" width="750" height="48" class="row-bg" />
  <text x="40" y="206" class="category">Programming</text>
  <text x="220" y="206" class="skills">Java, Python, C, C++, HTML, CSS, SQL</text>

  <!-- Row 4: Databases -->
  <rect x="25" y="234" width="750" height="48" class="row-bg" />
  <text x="40" y="264" class="category">Databases</text>
  <text x="220" y="264" class="skills">MySQL, PostgreSQL, SQLite, Tableau, Excel, Radiant</text>

  <!-- Row 5: Machine Learning -->
  <rect x="25" y="292" width="750" height="48" class="row-bg" />
  <text x="40" y="322" class="category">Machine Learning</text>
  <text x="220" y="322" class="skills">LLM Prompt Engineering, XGBoost, RAG Pipelines</text>
</svg>
